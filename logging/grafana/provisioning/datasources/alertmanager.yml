# Grafana 시작 시 Alertmanager 데이터 소스를 자동으로 등록한다.
# Grafana의 Alerting 메뉴에서 현재 발생 중인 알람과 silence를 확인/관리할 수 있다.
# (Alertmanager는 docker-compose.monitoring.yml에서 뜬다 - 로깅 스택만 띄우면 연결 실패로 표시될 뿐 Grafana는 정상 동작)
apiVersion: 1

datasources:
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
