# 모니터링 스택 (Prometheus)
# 기존 서비스 compose 파일과 함께 실행한다:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# 로깅 스택(docker-compose.logging.yml)과 같이 띄우면, 그쪽 Grafana에서
# 지표(Prometheus)와 로그(Loki)를 한 화면에서 같이 볼 수 있다:
#   docker compose -f docker-compose.yml -f docker-compose.logging.yml -f docker-compose.monitoring.yml up -d --build

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: auction-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  prometheus-data:
