# 4개 서비스(경매 엔진 / 실시간 중계 / Frontend / Redis) + DB(Postgres) 로컬 기동 확인용

services:
  db:
    image: postgres:16-alpine
    container_name: auction-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: auction
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auction" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  auction-engine:
    build: ./auction-engine
    container_name: auction-engine
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auction-db:5432/auction
      - SPRING_DATA_REDIS_HOST=auction-redis
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  realtime-relay:
    build: ./realtime-relay
    container_name: realtime-relay
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - REDIS_HOST=auction-redis
      - REDIS_PORT=6379
      - PORT=4000
    depends_on:
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - auction-engine
      - realtime-relay

volumes:
  db-data:
