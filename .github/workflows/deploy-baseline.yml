name: Deploy to school server (baseline)

# baseline 브랜치에 PR이 머지(=push)되면:
#   1) 3개 서비스 이미지를 빌드해 GHCR에 태그(커밋 SHA + baseline-latest)로 push
#   2) 학교 VDI에 설치된 self-hosted runner가 docker-compose.prod.yml로 배포
#      (학교 방화벽이 외부 인바운드 SSH를 막으므로 서버에서 GitHub로 나가는 연결만 사용)
#   3) 서버 내부에서 localhost로 헬스체크 (포트 외부 공개 불필요)

on:
  push:
    branches: [baseline]

permissions:
  contents: read
  packages: write   # GHCR push에 필요

env:
  IMAGE_TAG: ${{ github.sha }}
  # GHCR 이미지 경로는 소문자여야 함
  IMAGE_REGISTRY: ghcr.io/threeroun

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auction-engine, realtime-relay, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.service }}:baseline-latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, school-server]
    steps:
      # GHCR 패키지가 private일 수 있으므로 GITHUB_TOKEN으로 로그인 (job 종료 시 자동 로그아웃)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with docker compose
        working-directory: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          git fetch origin baseline
          git reset --hard origin/baseline
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f

  health-check:
    needs: deploy
    runs-on: [self-hosted, school-server]
    steps:
      - name: Verify frontend and product API on server
        run: |
          set -eu
          for path in / /api/products; do
            curl --fail --show-error --silent \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 10 \
              --retry-delay 5 \
              --retry-connrefused \
              --output /dev/null \
              "http://localhost:3000${path}"
          done
