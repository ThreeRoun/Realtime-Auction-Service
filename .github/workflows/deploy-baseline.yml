name: Deploy to school server (baseline)

# baseline 브랜치에 PR이 머지(=push)되면:
#   1) 3개 서비스 이미지를 빌드해 GHCR에 태그(커밋 SHA + baseline-latest)로 push
#   2) 학교 VDI에 설치된 self-hosted runner가 k3s 클러스터에 커밋 SHA 이미지로 배포
#      (학교 방화벽이 외부 인바운드 SSH를 막으므로 서버에서 GitHub로 나가는 연결만 사용)
#   3) 롤아웃 완료 + 서버 내부 localhost(Ingress)로 스모크 테스트
#   4) 2~3 중 하나라도 실패하면 배포 직전 이미지로 자동 롤백
#   5) 모니터링·로깅 스택(k8s/monitoring) 적용 - 별도 job이라 실패해도 앱 롤백과 무관하고,
#      앱 배포가 실패해도 장애 확인에 필요하므로 계속 적용한다

on:
  push:
    branches: [baseline]

permissions:
  contents: read
  packages: write   # GHCR push에 필요

# 연달아 머지돼도 배포가 겹치지 않게 순서대로 실행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-baseline
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}
  # GHCR 이미지 경로는 소문자여야 함
  IMAGE_REGISTRY: ghcr.io/threeroun
  NAMESPACE: auction
  APPS: auction-engine realtime-relay frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auction-engine, realtime-relay, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.service }}:baseline-latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, school-server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 계정의 kubeconfig(~/.kube/config)로 클러스터에 접근 가능한지 먼저 확인
      # k3s 내장 kubectl은 KUBECONFIG가 없으면 root 전용인 /etc/rancher/k3s/k3s.yaml을 읽는다.
      # 서비스로 도는 runner는 ~/.bashrc를 읽지 않으므로, 이후 모든 step에 KUBECONFIG를 명시한다.
      - name: Check cluster access
        run: |
          set -eu
          kubeconfig="${KUBECONFIG:-$HOME/.kube/config}"
          if [ ! -r "$kubeconfig" ]; then
            echo "::error::$(id -un) 계정에서 kubeconfig($kubeconfig)를 읽을 수 없습니다. k8s/README.md의 kubeconfig 설정을 runner 계정으로 진행하세요"
            exit 1
          fi
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          export KUBECONFIG="$kubeconfig"
          kubectl get namespace "$NAMESPACE" > /dev/null
          kubectl -n "$NAMESPACE" get secret auction-secret ghcr-secret > /dev/null

      # 롤백 기준점: 배포 직전에 돌고 있던 이미지 (rollout undo는 apply가 적용 전에 실패해도
      # 한 단계 더 이전 버전으로 되돌려 버리므로, 실제로 돌던 이미지를 기록해 두고 그걸로 되돌린다)
      - name: Record current images
        run: |
          set -eu
          for app in $APPS; do
            img=$(kubectl -n "$NAMESPACE" get deploy "$app" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name=='$app')].image}")
            echo "$app=$img" | tee -a "$RUNNER_TEMP/previous-images"
          done

      # prod overlay를 감싸는 임시 overlay로 이미지 태그만 커밋 SHA로 바꿔서 적용
      # (저장소 파일은 수정하지 않고, 서버에 kustomize 바이너리도 필요 없음)
      - name: Apply manifests (${{ env.IMAGE_TAG }})
        run: |
          set -eu
          mkdir -p .deploy
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources:"
            echo "  - ../k8s/overlays/prod"
            echo "images:"
            for app in $APPS; do
              echo "  - name: $IMAGE_REGISTRY/$app"
              echo "    newTag: \"$IMAGE_TAG\""
            done
          } > .deploy/kustomization.yaml
          kubectl apply -k .deploy

      - name: Wait for rollout
        run: |
          set -eu
          for app in $APPS; do
            kubectl -n "$NAMESPACE" rollout status deploy/"$app" --timeout=300s
          done

      # Ingress(Traefik, 80 포트)를 거쳐 frontend → auction-engine 경로까지 확인
      - name: Smoke test
        run: |
          set -eu
          for path in / /api/products; do
            curl --fail --show-error --silent \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 10 \
              --retry-delay 5 \
              --retry-connrefused \
              --output /dev/null \
              "http://localhost${path}"
          done

      - name: Roll back to previous images
        if: failure()
        run: |
          set -u
          echo "::error::배포 실패 - 배포 직전 이미지로 롤백합니다"
          if [ ! -s "$RUNNER_TEMP/previous-images" ]; then
            echo "::error::기록된 이전 이미지가 없어 자동 롤백을 건너뜁니다. 수동 확인이 필요합니다"
            exit 1
          fi
          kubectl -n "$NAMESPACE" get pods
          status=0
          # 목록은 fd 3으로 읽는다 (루프 안의 명령이 stdin을 소비해 다음 줄을 건너뛰는 것을 방지)
          while IFS='=' read -r app img <&3; do
            echo "$app -> $img"
            kubectl -n "$NAMESPACE" set image deploy/"$app" "$app=$img" || status=1
          done 3< "$RUNNER_TEMP/previous-images"
          for app in $APPS; do
            kubectl -n "$NAMESPACE" rollout status deploy/"$app" --timeout=300s || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::롤백도 실패했습니다. 서버에서 kubectl -n $NAMESPACE get pods 로 확인하세요"
          fi
          exit "$status"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### 배포 결과: ${{ job.status }}"
            echo
            echo "| 서비스 | 현재 이미지 |"
            echo "|---|---|"
            for app in $APPS; do
              img=$(kubectl -n "$NAMESPACE" get deploy "$app" \
                -o jsonpath="{.spec.template.spec.containers[?(@.name=='$app')].image}" 2>/dev/null || echo "-")
              echo "| $app | \`$img\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # 모니터링·로깅 스택 (Prometheus / Loki / Alloy / Grafana, namespace: monitoring)
  # - 앱 배포 job과 분리: 여기서 실패해도 앱은 롤백되지 않는다
  # - 앱 배포가 실패/건너뛰어져도 실행한다 (장애 상황일수록 모니터링이 필요)
  deploy-monitoring:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, school-server]
    env:
      MON_NAMESPACE: monitoring
      MON_APPS: prometheus loki alloy grafana
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check cluster access
        run: |
          set -eu
          kubeconfig="${KUBECONFIG:-$HOME/.kube/config}"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          export KUBECONFIG="$kubeconfig"
          if ! kubectl -n "$MON_NAMESPACE" get secret grafana-admin > /dev/null; then
            echo "::error::$MON_NAMESPACE 네임스페이스에 grafana-admin Secret이 없습니다. k8s/README.md의 모니터링 스택 사전 준비를 진행하세요"
            exit 1
          fi

      - name: Apply monitoring manifests
        run: kubectl apply -k k8s/monitoring

      - name: Wait for rollout
        run: |
          set -eu
          for app in $MON_APPS; do
            kubectl -n "$MON_NAMESPACE" rollout status deploy/"$app" --timeout=300s
          done

      # Ingress(/grafana) → Grafana 접속 확인 + Prometheus가 경매 엔진 지표를 수집하는지 확인
      - name: Smoke test
        run: |
          set -eu
          curl --fail --show-error --silent \
            --connect-timeout 5 --max-time 15 \
            --retry 10 --retry-delay 5 --retry-connrefused \
            --output /dev/null \
            "http://localhost/grafana/api/health"
          # 엔진이 재시작 중일 수 있으므로 수집 실패는 경고만 남긴다 (배포 실패로 처리하지 않음)
          up=$(kubectl -n "$MON_NAMESPACE" exec deploy/prometheus -- \
            wget -qO- 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22auction-engine%22%7D' || true)
          if echo "$up" | grep -q '"1"\]'; then
            echo "Prometheus: auction-engine 지표 수집 중"
          else
            echo "::warning::Prometheus가 auction-engine 지표를 수집하지 못하고 있습니다: $up"
          fi

      - name: Monitoring summary
        if: always()
        run: |
          {
            echo "### 모니터링 스택: ${{ job.status }}"
            echo
            echo '```'
            kubectl -n "$MON_NAMESPACE" get pods 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
