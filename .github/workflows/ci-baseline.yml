name: CI - baseline PR checks

# baseline 브랜치로 향하는 PR에서 실제 배포 전에 Dockerfile/컴포즈 구성이 깨지지 않는지 검증

on:
  pull_request:
    branches: [baseline]

jobs:
  build-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auction-engine, realtime-relay, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:pr-${{ github.event.pull_request.number }}

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kustomize 렌더링이 깨지지 않는지 + 렌더링 결과가 Kubernetes 스키마에 맞는지 검증
      - name: Render and validate manifests
        run: |
          set -eu
          kubectl kustomize k8s/overlays/prod > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < rendered.yaml

      # 모니터링·로깅 스택 매니페스트 + 각 설정 파일 문법 검증
      - name: Render and validate monitoring manifests
        run: |
          set -eu
          kubectl kustomize k8s/monitoring > rendered-monitoring.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < rendered-monitoring.yaml
          cfg="$PWD/k8s/monitoring/config"
          docker run --rm -v "$cfg":/c --entrypoint promtool prom/prometheus:v3.0.1 check config /c/prometheus.yml
          docker run --rm -v "$cfg":/c grafana/loki:3.5.3 -config.file=/c/loki.yaml -verify-config
          docker run --rm -v "$cfg":/c grafana/alloy:v1.11.0 fmt /c/config.alloy > /dev/null
