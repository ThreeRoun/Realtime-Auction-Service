name: CI - baseline PR checks

# baseline 브랜치로 향하는 PR에서 실제 배포 전에 Dockerfile/컴포즈 구성이 깨지지 않는지 검증

on:
  pull_request:
    branches: [baseline]

jobs:
  build-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auction-engine, realtime-relay, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:pr-${{ github.event.pull_request.number }}

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kustomize 렌더링이 깨지지 않는지 + 렌더링 결과가 Kubernetes 스키마에 맞는지 검증
      - name: Render and validate manifests
        run: |
          set -eu
          kubectl kustomize k8s/overlays/prod > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < rendered.yaml
