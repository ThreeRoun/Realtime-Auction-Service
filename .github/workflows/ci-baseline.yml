name: CI - baseline PR checks

# baseline 브랜치로 향하는 PR에서 실제 배포 전에 Docker 이미지 빌드와 k8s 매니페스트(앱, 모니터링)가 깨지지 않는지 검증

on:
  pull_request:
    branches: [baseline]

jobs:
  build-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auction-engine, realtime-relay, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:pr-${{ github.event.pull_request.number }}

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kustomize 렌더링이 깨지지 않는지 + 렌더링 결과가 Kubernetes 스키마에 맞는지 검증
      - name: Render and validate manifests
        run: |
          set -eu
          kubectl kustomize k8s/overlays/prod > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < rendered.yaml

      # 모니터링·로깅 스택 매니페스트 + 각 설정 파일 문법 검증
      - name: Render and validate monitoring manifests
        run: |
          set -eu
          kubectl kustomize k8s/monitoring > rendered-monitoring.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < rendered-monitoring.yaml
          cfg="$PWD/k8s/monitoring/config"
          # --syntax-only: Pod 안에만 있는 ServiceAccount 토큰 파일(cAdvisor 수집용) 존재 검사를 건너뛴다.
          #   알람 규칙 파일은 lint.yml의 monitoring job에서 따로 검사한다.
          docker run --rm -v "$cfg":/c --entrypoint promtool prom/prometheus:v3.0.1 check config --syntax-only /c/prometheus.yml
          docker run --rm -v "$cfg":/c grafana/loki:3.5.3 -config.file=/c/loki.yaml -verify-config
          docker run --rm -v "$cfg":/c grafana/alloy:v1.11.0 fmt /c/config.alloy > /dev/null
          # Grafana 대시보드: JSON 문법, uid 중복, kustomization.yaml 등록 누락 확인
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("k8s/monitoring")
          kust = (root / "kustomization.yaml").read_text()
          uids, errors = {}, []
          for f in sorted((root / "config/dashboards").glob("*.json")):
              d = json.loads(f.read_text())
              if not d.get("uid"):
                  errors.append(f"{f}: uid 없음")
              elif d["uid"] in uids:
                  errors.append(f"{f}: uid '{d['uid']}'가 {uids[d['uid']]}와 중복")
              uids[d.get("uid")] = f.name
              if f"config/dashboards/{f.name}" not in kust:
                  errors.append(f"{f}: kustomization.yaml의 grafana-dashboards에 없음")
          print("\n".join(errors) or f"dashboards OK ({len(uids)})")
          sys.exit(1 if errors else 0)
          PY
