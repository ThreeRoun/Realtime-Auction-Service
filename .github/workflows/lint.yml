name: Lint

on:
  pull_request:
    branches: [main, baseline]

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown docs
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  auction-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Checkstyle
        working-directory: auction-engine
        run: ./gradlew checkstyleMain checkstyleTest

  realtime-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: realtime-relay/package-lock.json

      - name: Install dependencies
        working-directory: realtime-relay
        run: npm ci

      - name: Run ESLint
        working-directory: realtime-relay
        run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
