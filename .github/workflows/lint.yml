name: Lint

on:
  pull_request:
    branches: [main, baseline]

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown docs
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  # 알람 규칙/설정 문법 + 규칙 단위 테스트(monitoring/prometheus/rules/tests)
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/monitoring":/m -w /m/prometheus --entrypoint promtool \
            prom/prometheus:v3.0.1 check rules rules/auction-engine.rules.yml
          docker run --rm -v "$PWD/monitoring":/m -w /m/prometheus/rules/tests --entrypoint promtool \
            prom/prometheus:v3.0.1 test rules auction-engine.rules.test.yml

      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager":/a --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /a/alertmanager.yml

  auction-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Checkstyle
        working-directory: auction-engine
        run: ./gradlew checkstyleMain checkstyleTest

  realtime-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: realtime-relay/package-lock.json

      - name: Install dependencies
        working-directory: realtime-relay
        run: npm ci

      - name: Run ESLint
        working-directory: realtime-relay
        run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
