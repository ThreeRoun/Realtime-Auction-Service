name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: 각 서비스 코드가 추가되면 서비스별 린트(Checkstyle/ESLint 등)로 확장
      - name: Lint Markdown docs
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: "**/*.md"
