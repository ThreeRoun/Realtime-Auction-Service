spring.application.name=auction-engine

# docker-compose.yml의 db 서비스(POSTGRES_USER/PASSWORD/DB=auction)와 맞춘 로컬 접속 정보
spring.datasource.url=jdbc:postgresql://localhost:5432/auction
spring.datasource.username=auction
spring.datasource.password=auction

# 테이블 구조는 Flyway 마이그레이션(db/migration)이 관리하므로, Hibernate는 생성하지 않고 일치 여부만 검증한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 로컬 개발용 기본값. 실제 배포 환경에서는 환경변수(JWT_SECRET)로 반드시 덮어써야 한다.
jwt.secret=${JWT_SECRET:3eeaT2gxbFshjn5ZsRGwvAx2zndh+8vHJQRT2A4DOs0=}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# 상품 이미지 저장 경로. S3 등 외부 스토리지 없이 이 서버(컨테이너) 로컬 디스크에 저장한다 -
# 컨테이너 재시작 후에도 유지되도록 이 경로를 볼륨으로 마운트한다 (서버: k8s PVC product-images, 로컬: docker-compose 볼륨).
app.product-image-dir=${PRODUCT_IMAGE_DIR:./data/product-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 모니터링(Prometheus)용 - prometheus/health만 노출한다. 다른 actuator 엔드포인트
# (env, beans 등)는 내부 설정/구조를 드러낼 수 있어 열지 않는다.
# health는 k8s readiness/liveness probe용(k8s/base/auction-engine.yaml 참고).
management.endpoints.web.exposure.include=prometheus,health
management.metrics.tags.application=${spring.application.name}
# HTTP 응답 시간을 히스토그램 버킷(_bucket)으로도 내보낸다 - Prometheus에서 p99 지연을 계산해
# 알람(k8s/monitoring/config/rules/auction-engine.rules.yml의 *LatencyHigh)을 걸기 위해 필요하다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# k8s probe 그룹 (/actuator/health/liveness, /actuator/health/readiness)
# - liveness: 앱 자체 상태만 본다. DB 같은 외부 의존성을 넣으면 DB 장애 때 Pod가 재시작 루프에 빠진다.
# - readiness: DB 연결까지 본다. DB가 끊기면 Service에서 빠져 요청을 받지 않는다.
#   Redis는 넣지 않는다 - 입찰 이벤트 발행에만 쓰여서(DB 커밋 후 발행) Redis 장애 시 실시간 중계만
#   멈추는데, readiness에 넣으면 상품 조회/로그인까지 전체 API가 차단되기 때문이다.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# 로그를 JSON으로 출력한다 - 로그 수집 스택(Alloy->Loki, PR #95)이 컨테이너 표준출력을
# 그대로 수집하는데, 텍스트면 Grafana에서 문자열 검색(|= "ERROR")만 가능하고 필드 단위로는
# 못 뽑는다. realtime-relay(pino, PR #97)와 맞춰서 여기도 JSON으로 통일한다.
logging.structured.format.console=logstash

# k8s가 Pod를 내릴 때(롤링 업데이트 등) SIGTERM을 보내도 바로 죽지 않고, 새 요청은 거부하되
# 이미 처리 중이던 요청(입찰 등)은 끝까지 마치고 종료한다. preStop(k8s/base/auction-engine.yaml)이
# Service 쪽 트래픽 라우팅 전파 시간을 벌어주는 동안, 여기 타임아웃 안에서 기존 요청을 정리한다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
