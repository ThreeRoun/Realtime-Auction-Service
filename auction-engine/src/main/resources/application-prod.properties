# 운영(prod) 프로파일. application.properties의 로컬 개발용 기본값(jwt.secret, DB 계정)을
# 여기서 기본값 없이 재정의한다 - 환경변수가 없으면 Spring이 기동 자체를 실패시키게 만들어서,
# "설정이 빠졌는데 레포에 공개된 기본값으로 조용히 떠버리는" 사고를 막는다 (이슈 #102).
#
# k8s/base/configmap.yaml에서 SPRING_PROFILES_ACTIVE=prod로 이 프로파일을 켜고,
# k8s/base/auction-engine.yaml이 auction-secret(Secret)에서 JWT_SECRET/POSTGRES_USER/
# POSTGRES_PASSWORD를 환경변수로 주입한다.
jwt.secret=${JWT_SECRET}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
