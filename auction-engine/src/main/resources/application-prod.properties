# 운영(prod) 프로파일. application.properties의 로컬 개발용 기본 JWT 키를 여기서 기본값
# 없이 재정의한다 - 환경변수가 없으면 Spring이 기동 자체를 실패시키게 만들어서, "설정이
# 빠졌는데 레포에 공개된 기본값으로 조용히 떠버리는" 사고를 막는다 (이슈 #102).
# k8s/base/configmap.yaml에서 SPRING_PROFILES_ACTIVE=prod로 이 프로파일을 켠다.
jwt.secret=${JWT_SECRET}

# DB 계정은 여기서 안 다룬다 - k8s/base/auction-engine.yaml이 SPRING_DATASOURCE_USERNAME/
# PASSWORD(스프링이 바로 인식하는 이름) 환경변수로 직접 주입하고 있어서, 그 값이 이 파일보다
# 우선순위가 높아 아래에 POSTGRES_USER 같은 이름으로 적어봐야 쓰이지 않는다(리뷰로 발견함).
# 대신 k8s의 secretKeyRef가 optional=false(기본값)라서, auction-secret에 해당 키가
# 없으면 Pod 자체가 기동하지 않는다 - 그쪽에서 이미 fail-fast가 보장된다.
