# auction-engine이 노출하는 /actuator/prometheus를 15초마다 긁어간다(scrape).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알람 규칙 (monitoring/prometheus/rules/*.rules.yml)
rule_files:
  - /etc/prometheus/rules/*.rules.yml

# 규칙에서 발생한 알람을 Alertmanager로 보낸다
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: auction-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auction-engine:8080"]
