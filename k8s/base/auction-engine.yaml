apiVersion: v1
kind: Service
metadata:
  name: auction-engine
spec:
  selector:
    app: auction-engine
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-engine
spec:
  # 여러 replica로 운영할 수 있다:
  # - 경매 마감 스케줄러는 ShedLock으로 한 Pod에서만 돈다
  # - 상품 이미지는 Pod 로컬 디스크가 아니라 공유 오브젝트 스토리지(object-storage.yaml)에 저장한다 (이슈 #101)
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auction-engine
  template:
    metadata:
      labels:
        app: auction-engine
      # 클러스터 Prometheus(k8s/monitoring)가 이 annotation을 보고 지표를 수집한다
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      # SIGTERM을 보내는 시점과 Service가 이 Pod를 엔드포인트 목록에서 빼는 시점이 완전히
      # 동시가 아니라서, preStop으로 몇 초 쉬어 그 전파 시간을 벌어준 다음에 SIGTERM을 보낸다.
      # 전체 유예 시간(terminationGracePeriodSeconds)은 preStop 대기 + 앱의 graceful shutdown
      # 처리 시간(application.properties의 spring.lifecycle.timeout-per-shutdown-phase=20s)을
      # 합친 것보다 여유 있게 잡는다 - 다 쓰면 k8s가 SIGKILL로 강제 종료한다.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: auction-engine
          image: ghcr.io/threeroun/auction-engine
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auction-engine-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auction-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auction-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auction-secret
                  key: JWT_SECRET
            # 상품 이미지 저장소(auction-s3) 접속 키 - auction-s3도 같은 키로 설정된다
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: auction-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auction-secret
                  key: S3_SECRET_KEY
          # Spring Boot Actuator probe 그룹 (application.properties 참고)
          # - startup/liveness: 앱 자체 상태만 확인 → 실패 시 컨테이너 재시작
          # - readiness: DB 연결 포함 → 실패 시 Service에서 제외 (재시작하지 않음)
          # DB가 끊기면 DB 헬스체크가 커넥션 타임아웃까지 응답을 붙잡고 있으므로,
          # timeoutSeconds를 짧게 둬서 응답 지연도 실패로 처리한다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
