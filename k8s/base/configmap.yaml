# 비밀이 아닌 설정값. 비밀번호/JWT 키는 auction-secret(Secret)에 따로 둔다 - k8s/README.md 참고
apiVersion: v1
kind: ConfigMap
metadata:
  name: auction-engine-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://auction-db:5432/auction
  SPRING_DATA_REDIS_HOST: auction-redis
  # 상품 이미지는 공유 오브젝트 스토리지(auction-s3, object-storage.yaml)에 저장한다 (이슈 #101).
  # 접속 키(S3_ACCESS_KEY/S3_SECRET_KEY)는 auction-secret에 있다.
  IMAGE_STORAGE_TYPE: s3
  S3_ENDPOINT: http://auction-s3:8333
  S3_BUCKET: product-images
  # -javaagent: OpenTelemetry Java 에이전트를 켜서 트레이스를 Alloy로 보낸다 (아래 OTEL_* 설정 사용)
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -javaagent:/app/opentelemetry-javaagent.jar
  # application-prod.properties를 활성화한다 - jwt.secret/DB 계정에 기본값이 없어서,
  # auction-secret(Secret)의 JWT_SECRET/POSTGRES_USER/POSTGRES_PASSWORD가 빠지면
  # (이슈 #102) 조용히 기본값을 쓰는 대신 기동 자체가 실패한다.
  SPRING_PROFILES_ACTIVE: prod
  # 트레이스 전송 설정 (OpenTelemetry 표준 환경변수, 이슈 #159). 계측(OTel 에이전트)이 없으면 아무 영향 없다.
  # 트레이스는 monitoring 네임스페이스의 Alloy로 보내고(OTLP HTTP), Alloy가 Tempo로 전달한다.
  # 서비스 이름은 Pod의 app 라벨(= Loki의 service 라벨)과 같아야 Grafana의 트레이스 -> 로그 이동이 동작한다.
  OTEL_SERVICE_NAME: auction-engine
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # 지표는 Prometheus, 로그는 stdout -> Alloy -> Loki로 이미 수집하므로 OTLP로는 트레이스만 보낸다
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-relay-config
data:
  REDIS_HOST: auction-redis
  REDIS_PORT: "6379"
  PORT: "4000"
  # 트레이스 전송 설정 (auction-engine-config 설명 참고). 계측(OTel Node SDK)이 없으면 아무 영향 없다.
  OTEL_SERVICE_NAME: realtime-relay
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
