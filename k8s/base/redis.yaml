# compose와 동일하게 영속화 없이 Pub/Sub 용도로만 사용
apiVersion: v1
kind: Service
metadata:
  name: auction-redis
spec:
  selector:
    app: auction-redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auction-redis
  template:
    metadata:
      labels:
        app: auction-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
