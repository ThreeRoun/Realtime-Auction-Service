# 상품 이미지 저장용 S3 호환 오브젝트 스토리지 (SeaweedFS, 이슈 #101)
# 경매 엔진 Pod들이 모두 이 한 곳에 이미지를 저장하고 읽어서, replica가 여러 개여도 어느 Pod를 거치든
# 같은 이미지를 서빙한다. 클러스터 밖으로는 노출하지 않는다 - 브라우저는 엔진의 /images/**로만 받는다.
#
# MinIO가 아닌 이유: 공식 MinIO 컨테이너 이미지 배포가 중단돼(Docker Hub 저장소 삭제, quay.io 401)
# 받을 수 있는 이미지가 보안 업데이트 없는 옛 버전뿐이다. 엔진은 S3 API만 쓰므로 서버 종류와 무관하다.
apiVersion: v1
kind: Service
metadata:
  name: auction-s3
spec:
  selector:
    app: auction-s3
  ports:
    - name: s3
      port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auction-s3
spec:
  serviceName: auction-s3
  # master/volume/filer/s3를 한 프로세스로 띄우는 단일 노드 구성 - 데이터 복제 없음.
  # 이미지 원본은 이 PVC 한 곳에만 있으므로 PVC를 지우면 이미지를 모두 잃는다.
  replicas: 1
  selector:
    matchLabels:
      app: auction-s3
  template:
    metadata:
      labels:
        app: auction-s3
    spec:
      # SeaweedFS는 서버 모드에서 S3 접속 키를 환경변수로 받지 않고 JSON 설정 파일로만 받는다.
      # 키를 저장소에 커밋하지 않도록, auction-secret의 키로 기동 직전에 설정 파일을 만들어
      # 메모리 기반 emptyDir로 본 컨테이너에 넘긴다. (키는 k8s/README.md 안내대로 hex 문자열만 쓴다 -
      # JSON에 그대로 들어가므로 따옴표 같은 문자가 있으면 설정이 깨진다)
      initContainers:
        - name: render-s3-config
          image: chrislusf/seaweedfs:4.51
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              printf '{"identities":[{"name":"auction-engine","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Admin"]}]}' \
                "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /config/s3.json
              chmod 644 /config/s3.json
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: auction-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auction-secret
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.51
          # 이미지 entrypoint가 /data 소유권을 맞춘 뒤 seaweed 사용자로 권한을 낮춰 실행한다.
          # - volumeSizeLimitMB/volume.max: 볼륨 파일 하나의 최대 크기와 개수. 기본값(1GB, 디스크 여유 기준 자동)은
          #   2Gi PVC에 비해 커서, 128MB x 8 = 최대 1GB로 PVC 안에 들어오게 제한한다.
          # - master.telemetry: 기본값으로 켜져 있는 외부 사용량 통계 전송을 끈다
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/config/s3.json
            - -master.volumeSizeLimitMB=128
            - -volume.max=8
            - -master.telemetry=false
          ports:
            - containerPort: 8333
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8333
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8333
            # 첫 기동 때 master 선출과 filer 준비에 시간이 걸린다
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
