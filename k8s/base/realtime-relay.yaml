apiVersion: v1
kind: Service
metadata:
  name: realtime-relay
spec:
  selector:
    app: realtime-relay
  ports:
    - port: 4000
---
# 각 Pod가 Redis auction_events 채널을 각자 구독해 자기에게 붙은 소켓에만 중계하므로
# replica를 늘려도 이벤트 누락/중복이 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-relay
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: realtime-relay
  template:
    metadata:
      labels:
        app: realtime-relay
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: realtime-relay
          image: ghcr.io/threeroun/realtime-relay
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: realtime-relay-config
          # 일반 HTTP 요청에는 426을 돌려주는 WS 전용 서버라, HTTP 헬스 엔드포인트 도입 전까지는 TCP로 확인
          readinessProbe:
            tcpSocket:
              port: 4000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
