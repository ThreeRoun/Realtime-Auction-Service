# Grafana: 지표(Prometheus)와 로그(Loki) 조회. Ingress의 /grafana 경로로 노출한다.
# 데이터 소스(config/grafana-datasources.yaml)와 대시보드(config/dashboards/*.json)는 레포에서 자동 등록한다.
# 관리자 계정은 grafana-admin Secret으로 서버에서 직접 만든다 (k8s/README.md 참고)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
---
# 사용자, UI에서 직접 만든 대시보드 등 Grafana 자체 데이터(SQLite) 보존용
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  # SQLite 파일을 두 Pod가 동시에 쓰지 않도록 기존 Pod를 먼저 내린다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Ingress의 /grafana 하위 경로에서 동작하도록 설정
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /grafana/api/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /grafana/api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # 대시보드 JSON (config/dashboards). PVC(/var/lib/grafana) 바깥 경로에 둔다
            - name: dashboards
              mountPath: /var/lib/grafana-dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
# 앱 Ingress(k8s/base/ingress.yaml, 경로 /)와 같은 진입점(Traefik :80)을 쓴다.
# Traefik은 더 긴 경로 규칙을 우선하므로 /grafana 요청은 이쪽으로, 나머지는 frontend로 간다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
