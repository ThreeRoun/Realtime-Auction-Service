# Tempo: 트레이스 저장소 (config/tempo.yaml, 보존 기간 7일)
# 트레이스는 Alloy만 보낸다(4317). 앱은 Alloy의 OTLP 포트로 보낸다 (alloy.yaml 참고).
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: monitoring
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200        # 조회 API (Grafana)
    - name: otlp-grpc
      port: 4317        # 트레이스 수신 (Alloy -> Tempo)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: monitoring
spec:
  replicas: 1
  # 같은 데이터 디렉터리(WAL, 블록)를 두 Pod가 동시에 쓰지 않도록 기존 Pod를 먼저 내린다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      # Tempo 이미지는 10001 사용자로 실행된다. 새 PVC는 root 소유라 쓰기 권한이 없으므로
      # fsGroup으로 볼륨 그룹을 맞춘다 (compose의 tempo-init chown과 같은 목적)
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.10.10
          args:
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - containerPort: 3200
            - containerPort: 4317
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
