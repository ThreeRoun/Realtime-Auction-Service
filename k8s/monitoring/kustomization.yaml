# 모니터링·로깅·알람 스택 - namespace: monitoring
#   Prometheus / Alertmanager / node-exporter / kube-state-metrics / Loki / Alloy / Grafana
# 앱(k8s/overlays/prod)과 따로 적용한다:  kubectl apply -k k8s/monitoring
#
# Prometheus의 Pod 조회 권한(Role)은 auction 네임스페이스에 만들어야 해서,
# kustomize의 namespace 일괄 지정 대신 각 리소스에 namespace를 직접 적었다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: realtime-auction-service
      app.kubernetes.io/component: observability

resources:
  - namespace.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - loki.yaml
  - alloy.yaml
  - grafana.yaml

# 설정 파일이 바뀌면 ConfigMap 이름(해시)이 바뀌어 해당 Pod가 자동으로 재시작된다
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - config/prometheus.yml
  - name: prometheus-rules
    namespace: monitoring
    files:
      - config/rules/auction-engine.rules.yml
      - config/rules/node.rules.yml
      - config/rules/kubernetes.rules.yml
      - config/rules/monitoring.rules.yml
  - name: alertmanager-config
    namespace: monitoring
    files:
      - config/alertmanager.yml
  - name: loki-config
    namespace: monitoring
    files:
      - config/loki.yaml
  - name: alloy-config
    namespace: monitoring
    files:
      - config/config.alloy
  - name: grafana-datasources
    namespace: monitoring
    files:
      - datasources.yaml=config/grafana-datasources.yaml
  - name: grafana-dashboard-provider
    namespace: monitoring
    files:
      - dashboards.yaml=config/grafana-dashboards.yaml
  # 대시보드를 추가하면 여기에도 파일을 적는다
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - config/dashboards/auction-engine.json
      - config/dashboards/k8s-cluster.json
