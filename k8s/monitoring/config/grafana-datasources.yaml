# Grafana 시작 시 데이터 소스를 자동 등록한다 (같은 monitoring 네임스페이스의 Service 이름으로 접근)
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
