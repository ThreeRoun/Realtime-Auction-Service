# 클러스터용 Prometheus 설정 (로컬 compose용은 monitoring/prometheus/prometheus.yml)
#
# auction / monitoring 네임스페이스에서 아래 annotation이 붙은 Pod를 자동으로 찾아 수집한다.
#   prometheus.io/scrape: "true"
#   prometheus.io/port:   "8080"
#   prometheus.io/path:   /actuator/prometheus   (생략 시 /metrics)
# Pod IP로 직접 수집하므로 replica가 늘어나도 Pod마다 따로 수집된다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알람 규칙 (k8s/monitoring/config/rules/*.rules.yml - compose 환경과 같은 파일)
rule_files:
  - /etc/prometheus-rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 앱(auction-engine) + 모니터링 구성요소(node-exporter, alertmanager)
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [auction, monitoring]
    relabel_configs:
      # annotation으로 수집 대상을 고른다
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      # 실행 중인 Pod만 (종료/실패한 Pod 제외)
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # job 라벨을 Pod의 app 라벨로 바꾼다 → job="auction-engine" (compose 환경과 같은 이름)
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # kube-state-metrics: 지표 자체에 namespace/pod 라벨이 들어 있으므로(대상 Pod 기준)
  # 위 job처럼 수집 대상의 namespace/pod 라벨을 덮어쓰지 않도록 따로 두고 honor_labels로 원래 라벨을 유지한다.
  - job_name: kube-state-metrics
    honor_labels: true
    static_configs:
      - targets: ["kube-state-metrics:8080"]

  # cAdvisor: 컨테이너별 실제 CPU/메모리/네트워크 사용량. 별도 Pod 없이 각 노드 kubelet(:10250)에 내장된 것을 쓴다.
  # kubelet은 ServiceAccount 토큰으로 인증하고, 권한은 nodes/metrics 읽기만 준다 (prometheus.yaml의 ClusterRole).
  - job_name: kubelet-cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
      - role: node
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    # k3s의 kubelet 인증서는 클러스터 CA로 서명되고 노드 IP가 들어 있어 그대로 검증된다
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    # cAdvisor는 지표 종류가 많아 디스크(4GB 보존)를 빨리 쓰므로 대시보드에 쓰는 것만 남긴다.
    # (CPU throttling 지표는 CPU limit을 건 컨테이너가 없어 수집하지 않는다)
    # 컨테이너 지표는 container 라벨이 있는 것만(Pod 단위 합계·pause 컨테이너 제외), 네트워크는 Pod 단위로만 나온다.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total)
        action: keep
      - source_labels: [__name__, container]
        regex: container_(cpu|memory).*;
        action: drop
