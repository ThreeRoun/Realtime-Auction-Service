# 클러스터용 Grafana Tempo 설정 (단일 바이너리). 로컬 compose용은 logging/tempo/tempo.yaml
# 앱 -> Alloy(OTLP) -> Tempo 로 트레이스가 들어오고, Grafana가 3200 포트로 조회한다.
# Tempo 3.x는 단일 바이너리에서도 Kafka가 필요해서, Kafka 없이 동작하는 2.10.x(2027-04까지 유지보수)를 쓴다.

stream_over_http_enabled: true

server:
  http_listen_port: 3200   # Grafana 조회용 API
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"   # Alloy가 보내는 트레이스를 받는다 (Service 포트도 monitoring 네임스페이스 내부 전용)

ingester:
  max_block_duration: 5m   # 메모리에 모은 트레이스를 5분마다 블록으로 저장

compactor:
  compaction:
    block_retention: 168h   # 보관 기간 7일 (Loki와 맞춰서 트레이스 -> 로그 이동이 끊기지 않게)

storage:
  trace:
    backend: local          # 별도 오브젝트 스토리지 없이 PVC(tempo-data)에 저장
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
